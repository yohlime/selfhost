services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: openclaw-gateway
    environment:
      HOME: /home/node
      TERM: xterm-256color
      XDG_RUNTIME_DIR: /run/user/1000/.flatpak/md.obsidian.Obsidian/xdg-run
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ./openclaw/.config:/home/node/.config
      - /home/yohlime/Documents/obsidian:/home/node/obsidian
      - /home/yohlime/.local/bin/obsidian:/usr/local/bin/obsidian:ro
      - /home/yohlime/.var/app/md.obsidian.Obsidian/config/obsidian/obsidian.json:/home/node/.var/app/md.obsidian.Obsidian/config/obsidian/obsidian.json:ro
      - /run/user/1000/.flatpak/md.obsidian.Obsidian/xdg-run:/run/user/1000/.flatpak/md.obsidian.Obsidian/xdg-run
      - /home/yohlime/Documents/obsidian:/home/yohlime/Documents/obsidian:rw
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    networks:
      - yohnet
    env_file:
      - openclaw/.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.openclaw.rule=Host(`openclaw.${DOMAIN}`)
      - traefik.http.routers.openclaw.entrypoints=websecure
      - traefik.http.routers.openclaw.tls.certresolver=letsencrypt
      - traefik.http.services.openclaw.loadbalancer.server.port=${OPENCLAW_GATEWAY_PORT}

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    profiles: ["cli"]
    container_name: openclaw-cli
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
      XDG_RUNTIME_DIR: /run/user/1000/.flatpak/md.obsidian.Obsidian/xdg-run
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - /home/yohlime/.local/bin/obsidian:/usr/local/bin/obsidian:ro
      - /home/yohlime/.var/app/md.obsidian.Obsidian/config/obsidian/obsidian.json:/home/node/.var/app/md.obsidian.Obsidian/config/obsidian/obsidian.json:ro
      - /run/user/1000/.flatpak/md.obsidian.Obsidian/xdg-run:/run/user/1000/.flatpak/md.obsidian.Obsidian/xdg-run
      - /home/yohlime/Documents/obsidian:/home/yohlime/Documents/obsidian:rw
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    networks:
      - yohnet
    env_file:
      - openclaw/.env
