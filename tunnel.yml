services:
  gluetun-qbit:
    image: qmcgaw/gluetun:latest
    container_name: gluetun_qbit
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
      - ./gluetun-qbit/.env
    volumes:
      - ./gluetun-qbit/data:/gluetun
    restart: unless-stopped
    networks:
      - yohnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbit.rule=Host(`qbit.${DOMAIN}`)
      - traefik.http.routers.qbit.entrypoints=websecure
      - traefik.http.routers.qbit.tls.certresolver=letsencrypt
      - traefik.http.routers.qbit.service=qbit
      - traefik.http.services.qbit.loadbalancer.server.port=8080

  gluetun-slskd:
    image: qmcgaw/gluetun:latest
    container_name: gluetun_slskd
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
      - ./gluetun-slskd/.env
    volumes:
      - ./gluetun-slskd/data:/gluetun
    restart: unless-stopped
    networks:
      - yohnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.slskd.rule=Host(`slskd.${DOMAIN}`)
      - traefik.http.routers.slskd.entrypoints=websecure
      - traefik.http.routers.slskd.tls.certresolver=letsencrypt
      - traefik.http.routers.slskd.service=slskd
      - traefik.http.services.slskd.loadbalancer.server.port=5030
