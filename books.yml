services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    volumes:
      - ./audiobookshelf/config:/config
      - ./audiobookshelf/metadata:/metadata
      - ../../audiobooks:/audiobooks
      # - </path/to/podcasts>:/podcasts
    restart: unless-stopped
    user: 1000:1000
    env_file:
      - ./.env
    networks:
      - yohnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.abshelf.rule=Host(`audiobooks.${DOMAIN}`)
      - traefik.http.routers.abshelf.entrypoints=websecure
      - traefik.http.routers.abshelf.tls.certresolver=letsencrypt
      - traefik.http.services.abshelf.loadbalancer.server.port=80

  mayberry:
    build:
      context: ./repos/mayberry-branch
      dockerfile: Dockerfile
    container_name: mayberry
    command: ["--daemon"]
    restart: unless-stopped
    environment:
      MAYBERRY_LIBRARY: "/library"
      HOME: "/config"
    volumes:
      - ./mayberry/config:/config/.mayberry
      - ../../books:/library
      - ../../audiobooks:/audiobooks
    networks:
      - yohnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.mayberry.rule=Host(`mayberry.${DOMAIN}`)
      - traefik.http.routers.mayberry.entrypoints=websecure
      - traefik.http.routers.mayberry.tls.certresolver=letsencrypt
      - traefik.http.services.mayberry.loadbalancer.server.port=1950

  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit
    restart: unless-stopped
    init: true
    env_file:
      - ./bookorbit/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      LIBRARY_BROWSE_ROOT: /
    depends_on:
      bookorbit-db:
        condition: service_healthy
    volumes:
      - ../../books:/books:rw
      - ../../audiobooks:/audiobooks:rw
      - ./bookorbit/data/app:/data
      - ./bookorbit/imports:/imports:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - yohnet
    labels:
      - traefik.enable=true
      - traefik.http.routers.bookorbit.rule=Host(`books.${DOMAIN}`)
      - traefik.http.routers.bookorbit.entrypoints=websecure
      - traefik.http.routers.bookorbit.tls.certresolver=letsencrypt
      - traefik.http.routers.bookorbit-public.rule=Host(`books.${ZONE_NAME}`)
      - traefik.http.routers.bookorbit-public.entrypoints=websecure
      - traefik.http.routers.bookorbit-public.tls.certresolver=letsencrypt
      - traefik.http.routers.bookorbit-public.service=bookorbit
      - traefik.http.services.bookorbit.loadbalancer.server.port=3000

  bookorbit-db:
    image: pgvector/pgvector:pg18
    container_name: bookorbit-db
    restart: unless-stopped
    env_file:
      - ./bookorbit/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./bookorbit/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - yohnet
