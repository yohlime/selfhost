services:
  garmin-mcp:
    build:
      context: https://github.com/taxuspt/garmin_mcp.git#a2ca5fcac34524b83814fe2fcf3d479f8a75983f
    image: selfhost-garmin-mcp:a2ca5fc
    container_name: garmin-mcp
    restart: unless-stopped
    init: true
    env_file:
      - ./garmin/.env
    environment:
      GARMIN_MCP_TRANSPORT: streamable-http
      GARMIN_MCP_HOST: 0.0.0.0
      GARMIN_MCP_PORT: 8000
      GARMIN_MCP_STATELESS_HTTP: "true"
      GARMIN_TOOL_PROFILE: all
    volumes:
      - garmin-tokens:/root/.garminconnect
    networks:
      - yohnet
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  garmin-tokens:
